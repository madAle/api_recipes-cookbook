# GitHub REST API: every operation of the description published by GitHub.
# Written with `api_recipes import` from version 1.1.4 of that description
# (github/rest-api-description, MIT license). Added by hand: `recipe`, `auth`,
# the Accept header, and a name for the fourteen endpoints that the import had
# told apart with a number, such as `revision`, `download`, `all_comments`.
# The small recipe with the most used calls is `github_essentials`.
github:
  recipe:
    name: github
    version: 2.0.0
    format: 1
    summary: GitHub REST API, every operation
    homepage: https://docs.github.com/en/rest
  auth:
    type: bearer                  # authorization = "Bearer TOKEN"; public data needs none
  host: api.github.com
  default_headers:
    Accept: application/vnd.github+json
  endpoints:
    root:                         # GET / (meta/root)
      path: ''
    advisories:                   # GET /advisories (security-advisories/list-global-advisories; query: ghsa_id, type, cve_id, ecosystem, severity, cwes, is_withdrawn, affects, published, updated, modified, epss_percentage, epss_percent
      endpoints:
        show:                     # GET /advisories/{ghsa_id} (security-advisories/get-global-advisory)
          path: "/:ghsa_id"
    agents:
      route: false
      endpoints:
        automations:              # GET /agents/automations (agent-automations/list-automations; query: page, per_page, type)
        repos:
          route: false
          endpoints:
            automations:          # GET /agents/repos/{owner}/{repo}/automations (agent-automations/list-repo-automations; query: page, per_page, type)
              path: "/:owner/:repo/automations"
              endpoints:
                create:           # POST /agents/repos/{owner}/{repo}/automations (agent-automations/create-repo-automation)
                  path: ''
                  verb: post
                  ok_code: 201
                available_tools:  # GET /agents/repos/{owner}/{repo}/automations/available-tools (agent-automations/list-available-repo-automation-tools)
                  path: "/available-tools"
                available_triggers: # GET /agents/repos/{owner}/{repo}/automations/available-triggers (agent-automations/list-available-repo-automation-triggers)
                  path: "/available-triggers"
                show:             # GET /agents/repos/{owner}/{repo}/automations/{automation_id} (agent-automations/get-repo-automation)
                  path: "/:automation_id"
                delete:           # DELETE /agents/repos/{owner}/{repo}/automations/{automation_id} (agent-automations/delete-repo-automation)
                  path: "/:automation_id"
                  verb: delete
                  ok_code: 204
                update:           # PATCH /agents/repos/{owner}/{repo}/automations/{automation_id} (agent-automations/edit-repo-automation)
                  path: "/:automation_id"
                  verb: patch
                revisions:        # GET /agents/repos/{owner}/{repo}/automations/{automation_id}/revisions (agent-automations/list-automation-revisions; query: cursor, per_page)
                  path: "/:automation_id/revisions"
                  endpoints:
                    show:         # GET /agents/repos/{owner}/{repo}/automations/{automation_id}/revisions/{revision_id} (agent-automations/get-automation-revision)
                      path: "/:revision_id"
                tasks:            # GET /agents/repos/{owner}/{repo}/automations/{automation_id}/tasks (agent-automations/list-repo-automation-tasks; query: per_page, page, sort, direction, state, is_archived)
                  path: "/:automation_id/tasks"
                  endpoints:
                    create:       # POST /agents/repos/{owner}/{repo}/automations/{automation_id}/tasks (agent-automations/create-repo-automation-task)
                      path: ''
                      verb: post
                      ok_code: 202
            pulls:
              path: "/:owner/:repo/pulls"
              route: false
              endpoints:
                agent_merge:      # GET /agents/repos/{owner}/{repo}/pulls/{pull_number}/agent-merge (agent-merge/get-agent-merge-enrollment)
                  path: "/:pull_number/agent-merge"
                  endpoints:
                    replace_all:  # PUT /agents/repos/{owner}/{repo}/pulls/{pull_number}/agent-merge (agent-merge/put-agent-merge-enrollment)
                      path: ''
                      verb: put
                      ok_code: [200, 201]
                    delete_all:   # DELETE /agents/repos/{owner}/{repo}/pulls/{pull_number}/agent-merge (agent-merge/delete-agent-merge-enrollment)
                      path: ''
                      verb: delete
                      ok_code: 204
            tasks:                # GET /agents/repos/{owner}/{repo}/tasks (agent-tasks/list-tasks-for-repo; query: per_page, page, sort, direction, state, is_archived, since, creator_id)
              path: "/:owner/:repo/tasks"
              endpoints:
                create:           # POST /agents/repos/{owner}/{repo}/tasks (agent-tasks/create-task-in-repo)
                  path: ''
                  verb: post
                  ok_code: 201
                show:             # GET /agents/repos/{owner}/{repo}/tasks/{task_id} (agent-tasks/get-task-by-repo-and-id)
                  path: "/:task_id"
        tasks:                    # GET /agents/tasks (agent-tasks/list-tasks; query: per_page, page, sort, direction, state, is_archived, since)
          endpoints:
            show:                 # GET /agents/tasks/{task_id} (agent-tasks/get-task-by-id)
              path: "/:task_id"
    app:                          # GET /app (apps/get-authenticated)
      endpoints:
        hook:
          route: false
          endpoints:
            config:               # GET /app/hook/config (apps/get-webhook-config-for-app)
              endpoints:
                update_all:       # PATCH /app/hook/config (apps/update-webhook-config-for-app)
                  path: ''
                  verb: patch
            deliveries:           # GET /app/hook/deliveries (apps/list-webhook-deliveries; query: per_page, cursor, status)
              endpoints:
                show:             # GET /app/hook/deliveries/{delivery_id} (apps/get-webhook-delivery)
                  path: "/:delivery_id"
                attempts:
                  path: "/:delivery_id/attempts"
                  route: false
                  endpoints:
                    create:       # POST /app/hook/deliveries/{delivery_id}/attempts (apps/redeliver-webhook-delivery)
                      path: ''
                      verb: post
                      ok_code: 202
        installation_requests:    # GET /app/installation-requests (apps/list-installation-requests-for-authenticated-app; query: per_page, page)
          path: "/installation-requests"
        installations:            # GET /app/installations (apps/list-installations; query: per_page, page, since, outdated)
          endpoints:
            show:                 # GET /app/installations/{installation_id} (apps/get-installation)
              path: "/:installation_id"
            delete:               # DELETE /app/installations/{installation_id} (apps/delete-installation)
              path: "/:installation_id"
              verb: delete
              ok_code: 204
            access_tokens:
              path: "/:installation_id/access_tokens"
              route: false
              endpoints:
                create:           # POST /app/installations/{installation_id}/access_tokens (apps/create-installation-access-token)
                  path: ''
                  verb: post
                  ok_code: 201
            suspended:
              path: "/:installation_id/suspended"
              route: false
              endpoints:
                replace_all:      # PUT /app/installations/{installation_id}/suspended (apps/suspend-installation)
                  path: ''
                  verb: put
                  ok_code: 204
                delete_all:       # DELETE /app/installations/{installation_id}/suspended (apps/unsuspend-installation)
                  path: ''
                  verb: delete
                  ok_code: 204
    app_manifests:
      path: "/app-manifests"
      route: false
      endpoints:
        conversions:
          path: "/:code/conversions"
          route: false
          endpoints:
            create:               # POST /app-manifests/{code}/conversions (apps/create-from-manifest)
              path: ''
              verb: post
              ok_code: 201
    applications:
      route: false
      endpoints:
        grant:
          path: "/:client_id/grant"
          route: false
          endpoints:
            delete_all:           # DELETE /applications/{client_id}/grant (apps/delete-authorization)
              path: ''
              verb: delete
              ok_code: 204
        token:
          path: "/:client_id/token"
          route: false
          endpoints:
            create:               # POST /applications/{client_id}/token (apps/check-token)
              path: ''
              verb: post
            delete_all:           # DELETE /applications/{client_id}/token (apps/delete-token)
              path: ''
              verb: delete
              ok_code: 204
            update_all:           # PATCH /applications/{client_id}/token (apps/reset-token)
              path: ''
              verb: patch
            scoped:
              route: false
              endpoints:
                create:           # POST /applications/{client_id}/token/scoped (apps/scope-token)
                  path: ''
                  verb: post
    apps:
      route: false
      endpoints:
        show:                     # GET /apps/{app_slug} (apps/get-by-slug)
          path: "/:app_slug"
    assignments:
      route: false
      endpoints:
        show:                     # GET /assignments/{assignment_id} (classroom/get-an-assignment; deprecated)
          path: "/:assignment_id"
        accepted_assignments:     # GET /assignments/{assignment_id}/accepted_assignments (classroom/list-accepted-assignments-for-an-assignment; deprecated)
          path: "/:assignment_id/accepted_assignments"
        grades:                   # GET /assignments/{assignment_id}/grades (classroom/get-assignment-grades; deprecated)
          path: "/:assignment_id/grades"
    classrooms:                   # GET /classrooms (classroom/list-classrooms; deprecated)
      endpoints:
        show:                     # GET /classrooms/{classroom_id} (classroom/get-a-classroom; deprecated)
          path: "/:classroom_id"
        assignments:              # GET /classrooms/{classroom_id}/assignments (classroom/list-assignments-for-a-classroom; deprecated)
          path: "/:classroom_id/assignments"
    codes_of_conduct:             # GET /codes_of_conduct (codes-of-conduct/get-all-codes-of-conduct)
      endpoints:
        show:                     # GET /codes_of_conduct/{key} (codes-of-conduct/get-conduct-code)
          path: "/:key"
    credentials:
      route: false
      endpoints:
        revoke:
          route: false
          endpoints:
            create:               # POST /credentials/revoke (credentials/revoke)
              path: ''
              verb: post
              ok_code: 202
    emojis:                       # GET /emojis (emojis/get)
    enterprises:
      route: false
      endpoints:
        actions:
          path: "/:enterprise/actions"
          route: false
          endpoints:
            cache:
              route: false
              endpoints:
                retention_limit:  # GET /enterprises/{enterprise}/actions/cache/retention-limit (actions/get-actions-cache-retention-limit-for-enterprise)
                  path: "/retention-limit"
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/actions/cache/retention-limit (actions/set-actions-cache-retention-limit-for-enterprise)
                      path: ''
                      verb: put
                      ok_code: 204
                storage_limit:    # GET /enterprises/{enterprise}/actions/cache/storage-limit (actions/get-actions-cache-storage-limit-for-enterprise)
                  path: "/storage-limit"
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/actions/cache/storage-limit (actions/set-actions-cache-storage-limit-for-enterprise)
                      path: ''
                      verb: put
                      ok_code: 204
            oidc:
              route: false
              endpoints:
                customization:
                  route: false
                  endpoints:
                    properties:
                      route: false
                      endpoints:
                        repo:     # GET /enterprises/{enterprise}/actions/oidc/customization/properties/repo (oidc/list-oidc-custom-property-inclusions-for-enterprise)
                          endpoints:
                            create: # POST /enterprises/{enterprise}/actions/oidc/customization/properties/repo (oidc/create-oidc-custom-property-inclusion-for-enterprise)
                              path: ''
                              verb: post
                              ok_code: 201
                            delete: # DELETE /enterprises/{enterprise}/actions/oidc/customization/properties/repo/{custom_property_name} (oidc/delete-oidc-custom-property-inclusion-for-enterprise)
                              path: "/:custom_property_name"
                              verb: delete
                              ok_code: 204
        code_security:
          path: "/:enterprise/code-security"
          route: false
          endpoints:
            configurations:       # GET /enterprises/{enterprise}/code-security/configurations (code-security/get-configurations-for-enterprise; query: per_page, before, after)
              endpoints:
                create:           # POST /enterprises/{enterprise}/code-security/configurations (code-security/create-configuration-for-enterprise)
                  path: ''
                  verb: post
                  ok_code: 201
                defaults:         # GET /enterprises/{enterprise}/code-security/configurations/defaults (code-security/get-default-configurations-for-enterprise)
                show:             # GET /enterprises/{enterprise}/code-security/configurations/{configuration_id} (code-security/get-single-configuration-for-enterprise)
                  path: "/:configuration_id"
                delete:           # DELETE /enterprises/{enterprise}/code-security/configurations/{configuration_id} (code-security/delete-configuration-for-enterprise)
                  path: "/:configuration_id"
                  verb: delete
                  ok_code: 204
                update:           # PATCH /enterprises/{enterprise}/code-security/configurations/{configuration_id} (code-security/update-enterprise-configuration)
                  path: "/:configuration_id"
                  verb: patch
                attach:
                  path: "/:configuration_id/attach"
                  route: false
                  endpoints:
                    create:       # POST /enterprises/{enterprise}/code-security/configurations/{configuration_id}/attach (code-security/attach-enterprise-configuration)
                      path: ''
                      verb: post
                      ok_code: 202
                as_default:
                  path: "/:configuration_id/defaults"
                  route: false
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/code-security/configurations/{configuration_id}/defaults (code-security/set-configuration-as-default-for-enterprise)
                      path: ''
                      verb: put
                repositories:     # GET /enterprises/{enterprise}/code-security/configurations/{configuration_id}/repositories (code-security/get-repositories-for-enterprise-configuration; query: per_page, before, after, status)
                  path: "/:configuration_id/repositories"
        copilot:
          path: "/:enterprise/copilot"
          route: false
          endpoints:
            metrics:
              route: false
              endpoints:
                reports:
                  route: false
                  endpoints:
                    enterprise_1_day: # GET /enterprises/{enterprise}/copilot/metrics/reports/enterprise-1-day (copilot/copilot-enterprise-one-day-usage-metrics; query: day*)
                      path: "/enterprise-1-day"
                    enterprise_28_day:
                      path: "/enterprise-28-day"
                      route: false
                      endpoints:
                        latest:   # GET /enterprises/{enterprise}/copilot/metrics/reports/enterprise-28-day/latest (copilot/copilot-enterprise-usage-metrics)
                    repos_1_day:  # GET /enterprises/{enterprise}/copilot/metrics/reports/repos-1-day (copilot/copilot-enterprise-repos-one-day-report; query: day*)
                      path: "/repos-1-day"
                      ok_code: [200, 204]
                    user_teams_1_day: # GET /enterprises/{enterprise}/copilot/metrics/reports/user-teams-1-day (copilot/copilot-enterprise-user-teams-one-day-report; query: day*)
                      path: "/user-teams-1-day"
                    users_1_day:  # GET /enterprises/{enterprise}/copilot/metrics/reports/users-1-day (copilot/copilot-users-one-day-usage-metrics; query: day*)
                      path: "/users-1-day"
                    users_28_day:
                      path: "/users-28-day"
                      route: false
                      endpoints:
                        latest:   # GET /enterprises/{enterprise}/copilot/metrics/reports/users-28-day/latest (copilot/copilot-users-usage-metrics)
            policies:
              route: false
              endpoints:
                code_review:      # GET /enterprises/{enterprise}/copilot/policies/code-review (copilot/get-enterprise-code-review-policy)
                  path: "/code-review"
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/copilot/policies/code-review (copilot/set-enterprise-code-review-policy)
                      path: ''
                      verb: put
                      ok_code: 204
                coding_agent:
                  route: false
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/copilot/policies/coding_agent (copilot/set-enterprise-coding-agent-policy)
                      path: ''
                      verb: put
                      ok_code: 204
                    organizations:
                      route: false
                      endpoints:
                        create:   # POST /enterprises/{enterprise}/copilot/policies/coding_agent/organizations (copilot/add-organizations-to-enterprise-coding-agent-policy)
                          path: ''
                          verb: post
                          ok_code: 204
                        delete_all: # DELETE /enterprises/{enterprise}/copilot/policies/coding_agent/organizations (copilot/remove-organizations-from-enterprise-coding-agent-policy)
                          path: ''
                          verb: delete
                          ok_code: 204
        dependabot:
          path: "/:enterprise/dependabot"
          route: false
          endpoints:
            alerts:               # GET /enterprises/{enterprise}/dependabot/alerts (dependabot/list-alerts-for-enterprise; query: classification, state, severity, ecosystem, package, epss_percentage, has, assignee, scope, relationship,
            repository_access:    # GET /enterprises/{enterprise}/dependabot/repository-access (dependabot/repository-access-for-enterprise; query: page, per_page)
              path: "/repository-access"
              endpoints:
                update_all:       # PATCH /enterprises/{enterprise}/dependabot/repository-access (dependabot/update-repository-access-for-enterprise)
                  path: ''
                  verb: patch
                  ok_code: 204
                default_level:
                  path: "/default-level"
                  route: false
                  endpoints:
                    replace_all:  # PUT /enterprises/{enterprise}/dependabot/repository-access/default-level (dependabot/set-repository-access-default-level-for-enterprise)
                      path: ''
                      verb: put
                      ok_code: 204
    events:                       # GET /events (activity/list-public-events; query: per_page, page)
    feeds:                        # GET /feeds (activity/get-feeds)
    gists:                        # GET /gists (gists/list; query: since, per_page, page)
      endpoints:
        create:                   # POST /gists (gists/create)
          path: ''
          verb: post
          ok_code: 201
        public:                   # GET /gists/public (gists/list-public; query: since, per_page, page)
        starred:                  # GET /gists/starred (gists/list-starred; query: since, per_page, page)
        show:                     # GET /gists/{gist_id} (gists/get)
          path: "/:gist_id"
        delete:                   # DELETE /gists/{gist_id} (gists/delete)
          path: "/:gist_id"
          verb: delete
          ok_code: 204
        update:                   # PATCH /gists/{gist_id} (gists/update)
          path: "/:gist_id"
          verb: patch
        comments:                 # GET /gists/{gist_id}/comments (gists/list-comments; query: per_page, page)
          path: "/:gist_id/comments"
          endpoints:
            create:               # POST /gists/{gist_id}/comments (gists/create-comment)
              path: ''
              verb: post
              ok_code: 201
            show:                 # GET /gists/{gist_id}/comments/{comment_id} (gists/get-comment)
              path: "/:comment_id"
            delete:               # DELETE /gists/{gist_id}/comments/{comment_id} (gists/delete-comment)
              path: "/:comment_id"
              verb: delete
              ok_code: 204
            update:               # PATCH /gists/{gist_id}/comments/{comment_id} (gists/update-comment)
              path: "/:comment_id"
              verb: patch
        commits:                  # GET /gists/{gist_id}/commits (gists/list-commits; query: per_page, page)
          path: "/:gist_id/commits"
        forks:                    # GET /gists/{gist_id}/forks (gists/list-forks; query: per_page, page)
          path: "/:gist_id/forks"
          endpoints:
            create:               # POST /gists/{gist_id}/forks (gists/fork)
              path: ''
              verb: post
              ok_code: 201
        star:                     # GET /gists/{gist_id}/star (gists/check-is-starred)
          path: "/:gist_id/star"
          ok_code: 204
          endpoints:
            replace_all:          # PUT /gists/{gist_id}/star (gists/star)
              path: ''
              verb: put
              ok_code: 204
            delete_all:           # DELETE /gists/{gist_id}/star (gists/unstar)
              path: ''
              verb: delete
              ok_code: 204
        revision:                 # GET /gists/{gist_id}/{sha} (gists/get-revision)
          path: "/:gist_id/:sha"
    gitignore:
      route: false
      endpoints:
        templates:                # GET /gitignore/templates (gitignore/get-all-templates)
          endpoints:
            show:                 # GET /gitignore/templates/{name} (gitignore/get-template)
              path: "/:name"
    installation:
      route: false
      endpoints:
        repositories:             # GET /installation/repositories (apps/list-repos-accessible-to-installation; query: per_page, page)
        token:
          route: false
          endpoints:
            delete_all:           # DELETE /installation/token (apps/revoke-installation-access-token)
              path: ''
              verb: delete
              ok_code: 204
    issues:                       # GET /issues (issues/list; query: filter, state, labels, sort, direction, since, collab, orgs, owned, pulls, per_page, page)
    licenses:                     # GET /licenses (licenses/get-all-commonly-used; query: featured, per_page, page)
      endpoints:
        show:                     # GET /licenses/{license} (licenses/get)
          path: "/:license"
    markdown:
      route: false
      endpoints:
        create:                   # POST /markdown (markdown/render)
          path: ''
          verb: post
        raw:
          route: false
          endpoints:
            create:               # POST /markdown/raw (markdown/render-raw)
              path: ''
              verb: post
    marketplace_listing:
      route: false
      endpoints:
        accounts:
          route: false
          endpoints:
            show:                 # GET /marketplace_listing/accounts/{account_id} (apps/get-subscription-plan-for-account)
              path: "/:account_id"
        plans:                    # GET /marketplace_listing/plans (apps/list-plans; query: per_page, page)
          endpoints:
            accounts:             # GET /marketplace_listing/plans/{plan_id}/accounts (apps/list-accounts-for-plan; query: sort, direction, per_page, page)
              path: "/:plan_id/accounts"
        stubbed:
          route: false
          endpoints:
            accounts:
              route: false
              endpoints:
                show:             # GET /marketplace_listing/stubbed/accounts/{account_id} (apps/get-subscription-plan-for-account-stubbed)
                  path: "/:account_id"
            plans:                # GET /marketplace_listing/stubbed/plans (apps/list-plans-stubbed; query: per_page, page)
              endpoints:
                accounts:         # GET /marketplace_listing/stubbed/plans/{plan_id}/accounts (apps/list-accounts-for-plan-stubbed; query: sort, direction, per_page, page)
                  path: "/:plan_id/accounts"
    meta:                         # GET /meta (meta/get)
    networks:
      route: false
      endpoints:
        events:                   # GET /networks/{owner}/{repo}/events (activity/list-public-events-for-repo-network; query: per_page, page)
          path: "/:owner/:repo/events"
    notifications:                # GET /notifications (activity/list-notifications-for-authenticated-user; query: all, is_done, participating, since, before, page, per_page)
      endpoints:
        replace_all:              # PUT /notifications (activity/mark-notifications-as-read)
          path: ''
          verb: put
          ok_code: [202, 205]
        threads:
          route: false
          endpoints:
            show:                 # GET /notifications/threads/{thread_id} (activity/get-thread)
              path: "/:thread_id"
            delete:               # DELETE /notifications/threads/{thread_id} (activity/mark-thread-as-done)
              path: "/:thread_id"
              verb: delete
              ok_code: 204
            update:               # PATCH /notifications/threads/{thread_id} (activity/mark-thread-as-read)
              path: "/:thread_id"
              verb: patch
              ok_code: 205
            subscription:         # GET /notifications/threads/{thread_id}/subscription (activity/get-thread-subscription-for-authenticated-user)
              path: "/:thread_id/subscription"
              endpoints:
                replace_all:      # PUT /notifications/threads/{thread_id}/subscription (activity/set-thread-subscription)
                  path: ''
                  verb: put
                delete_all:       # DELETE /notifications/threads/{thread_id}/subscription (activity/delete-thread-subscription)
                  path: ''
                  verb: delete
                  ok_code: 204
    octocat:                      # GET /octocat (meta/get-octocat; query: s)
    organizations:                # GET /organizations (orgs/list; query: since, per_page)
      endpoints:
        actions:
          path: "/:org/actions"
          route: false
          endpoints:
            cache:
              route: false
              endpoints:
                retention_limit:  # GET /organizations/{org}/actions/cache/retention-limit (actions/get-actions-cache-retention-limit-for-organization)
                  path: "/retention-limit"
                  endpoints:
                    replace_all:  # PUT /organizations/{org}/actions/cache/retention-limit (actions/set-actions-cache-retention-limit-for-organization)
                      path: ''
                      verb: put
                      ok_code: 204
                storage_limit:    # GET /organizations/{org}/actions/cache/storage-limit (actions/get-actions-cache-storage-limit-for-organization)
